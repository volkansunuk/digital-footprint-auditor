services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: digital-footprint-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: src/DigitalFootprintAuditor.Api/Dockerfile
      target: migrations
    container_name: digital-footprint-migrate
    command:
      - "--connection"
      - "Server=sqlserver,1433;Database=DigitalFootprintDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/DigitalFootprintAuditor.Api/Dockerfile
      target: final
    container_name: digital-footprint-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DigitalFootprintDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      ExternalServices__Gravatar__BaseUrl: "https://www.gravatar.com"
    ports:
      - "5193:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlserver-data: